            - term [ref=e115]: Budget vs actual
            - definition [ref=e116]: What the farm planned to earn/spend each month vs what actually happened. The difference is the variance.
          - generic [ref=e117]:
            - term [ref=e118]: Sale docket
            - definition [ref=e119]: The paper slip a stock agent issues when livestock are sold. Often the only record that a sale happened.
          - generic [ref=e120]:
            - term [ref=e121]: Stock reconciliation
            - definition [ref=e122]: Proving opening animals + births + purchases − deaths − sales = closing animals. When it doesn't balance, something was missed (or counted twice).
